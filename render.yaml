services:
  - type: web
    name: eco-userbot
    env: docker
    plan: free
    healthCheckPath: /ping
    envVars:
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: SESSION_STRING
        sync: false
      - key: OWNER_ID
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_API_URL
        value: https://api.deepseek.com/chat/completions
      - key: DEEPSEEK_MODEL
        value: deepseek-chat
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB_NAME
        value: eco_userbot
      - key: GROUP_REPLY_CHANCE
        value: "0.35"
      - key: MAX_HISTORY_MESSAGES
        value: "20"
      - key: COMMAND_PREFIX
        value: "."
      - key: PORT
        value: "8080"
